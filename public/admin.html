<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Mart Admin</title><meta name="robots" content="noindex">
<style>body{font-family:system-ui;margin:0;background:#f2f5f2}header{background:#0b5d1e;color:#fff;padding:12px 16px;display:flex;justify-content:space-between}main{padding:16px;max-width:1000px;margin:auto}section{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px}input,select,textarea,button{padding:9px;margin:3px 0;font:inherit;border:1px solid #ccc;border-radius:6px;width:100%}button{background:#0b5d1e;color:#fff;border:0;cursor:pointer;width:auto}button.d{background:#c22}.r{display:flex;gap:8px;justify-content:space-between;border-bottom:1px solid #eee;padding:6px 0;align-items:center;flex-wrap:wrap}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}h3{margin-top:0}</style></head><body>
<div id="login" style="max-width:320px;margin:80px auto;padding:20px;background:#fff;border-radius:10px"><h2>Daily Mart Owner Login</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="lg()">Login</button><p id="er" style="color:red"></p></div>
<div id="dash" hidden><header><b>Daily Mart – Admin</b><button class="d" onclick="fetch('/admin/logout',{method:'POST'}).then(()=>location.reload())">Logout</button></header><main>
<section><h3 id="ft">Add Product</h3><form id="pf" class="g"><input type="hidden" name="id"><input name="name" placeholder="Product name" required><select name="category_id" id="cs"></select><input name="price" type="number" placeholder="Original price (PKR)" required><input name="sale_price" type="number" placeholder="Discounted price (PKR)"><input name="stock" type="number" placeholder="Stock" required><select name="section"><option value="">No section</option><option value="featured">Featured</option><option value="new">New Arrivals</option><option value="best">Best Sellers</option><option value="deal">Special Discounts</option></select><input name="sizes" placeholder="Sizes: S,M,L"><input name="colors" placeholder="Colors: Red,Blue"><textarea name="description" placeholder="Description"></textarea><textarea name="specs" placeholder="Specifications (one per line)"></textarea><input type="file" name="image" accept="image/*"><div><button>Save Product</button> <button type="button" onclick="pf.reset();pf.id.value='';ft.textContent='Add Product'">Clear</button></div></form></section>
<section><h3>Products</h3><div id="pl"></div></section>
<section><h3>Orders</h3><div id="ol"></div></section>
<section><h3>Categories</h3><div class="r"><input id="cn" placeholder="New category"><button onclick="ac()">Add</button></div><div id="cl"></div></section>
<section><h3>Homepage Banners</h3><form id="bf" class="g"><input name="title" placeholder="Headline"><input name="subtitle" placeholder="Subtitle"><input type="file" name="image" accept="image/*"><button>Add Banner</button></form><div id="bl"></div></section></main></div>
<script>
const $=s=>document.querySelector(s),J=(u,m='GET',b)=>fetch('/api/admin'+u,{method:m,headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined}).then(r=>r.json()),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');let P=[];
async function lg(){const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u.value,pass:p.value})});r.ok?init():er.textContent=(await r.json()).error}
async function init(){if((await fetch('/api/admin/me')).status!=200)return;login.hidden=true;dash.hidden=false;load()}
async function load(){const[c,p,o,b]=await Promise.all([fetch('/api/categories').then(r=>r.json()),fetch('/api/products').then(r=>r.json()),J('/orders'),fetch('/api/banners').then(r=>r.json())]);P=p;
 cs.innerHTML=c.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');cl.innerHTML=c.map(x=>`<div class="r">${esc(x.name)}<button class="d" onclick="del('/categories/${x.id}')">Delete</button></div>`).join('');
 pl.innerHTML=p.map(x=>`<div class="r"><span>${esc(x.name)} — Rs.${x.sale_price>0?x.sale_price:x.price} — stock ${x.stock}</span><span><button onclick="ed(${x.id})">Edit</button> <button class="d" onclick="del('/products/${x.id}')">Delete</button></span></div>`).join('');
 ol.innerHTML=o.map(x=>`<div class="r"><span><b>#${x.id}</b> ${esc(x.name)} ${esc(x.phone)}<br>${esc(x.address)}<br>${JSON.parse(x.items).map(i=>esc(i.name)+' ×'+i.qty).join(', ')} — <b>Rs.${x.total}</b></span><select onchange="J('/orders/${x.id}','PUT',{status:this.value})">${['Pending','Confirmed','Shipped','Delivered','Cancelled'].map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'No orders yet';
 bl.innerHTML=b.map(x=>`<div class="r">${esc(x.title)} <button class="d" onclick="del('/banners/${x.id}')">Delete</button></div>`).join('')}
async function del(u){if(confirm('Delete?')){await J(u,'DELETE');load()}}
async function ac(){const r=await J('/categories','POST',{name:cn.value});if(r.error)alert(r.error);cn.value='';load()}
function ed(id){const x=P.find(p=>p.id==id);for(const k in x)if(pf[k]&&pf[k].type!='file')pf[k].value=x[k]??'';ft.textContent='Edit Product #'+id;scrollTo(0,0)}
pf.onsubmit=async e=>{e.preventDefault();const f=new FormData(pf),id=f.get('id');f.delete('id');const r=await fetch('/api/admin/products'+(id?'/'+id:''),{method:id?'PUT':'POST',body:f});if(r.ok){pf.reset();pf.id.value='';ft.textContent='Add Product';load()}else alert('Error saving')}
bf.onsubmit=async e=>{e.preventDefault();await fetch('/api/admin/banners',{method:'POST',body:new FormData(bf)});bf.reset();load()}
init();
</script></body></html>
